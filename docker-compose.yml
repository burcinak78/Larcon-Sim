# Larcon-Sim — temel compose (prod ile aynı topoloji).
# Reverse proxy / TLS YOK: SSL Cloudflare'de sonlanır, LB düz HTTP ile frontend'e gelir.
# Lokal geliştirme portları docker-compose.override.yml içinde (otomatik yüklenir).
name: larcon-sim

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chainguard imajı 65532 kullanıcısıyla çalışır; volume sahipliğini bir kez ayarlar.
  storage-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - storage-data:/data
    restart: "no"

  # NOT: Resmi minio/minio imajları artık yayınlanmıyor (bkz. vault ADR-005).
  # Aşama 0 için güncel MinIO build'i olan Chainguard imajı kullanılıyor; kalıcı seçim Aşama 3'te.
  storage:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
    volumes:
      - storage-data:/data
    depends_on:
      storage-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    image: ${REGISTRY}/backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Storage__Endpoint: http://storage:9000
      Storage__AccessKey: ${STORAGE_ROOT_USER}
      Storage__SecretKey: ${STORAGE_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    image: ${REGISTRY}/frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
